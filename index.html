              <ol className="space-y-3">
                {currentRecipe.instructions.map((instruction, idx) => (
                  <li key={idx} className="flex items-start">
                    <span className="font-semibold text-amber-600 mr-3">{idx + 1}.</span>
                    <span>{instruction}</span>
                  </li>
                ))}
              </ol>
            </div>

            {currentRecipe.notes && (
              <div className="bg-amber-50 p-4 rounded-lg border-l-4 border-amber-400">
                <p className="text-sm"><strong>Note:</strong> {currentRecipe.notes}</p>
              </div>
            )}
          </div>
        </div>
      );

      const renderTip = () => (
        <div className="max-w-4xl mx-auto p-8 bg-amber-50">
          <div className="bg-white rounded-lg shadow-lg p-8">
            <h2 className="text-3xl font-bold text-amber-900 mb-4">
              {currentTip.icon} {currentTip.title}
            </h2>
            <div className="prose max-w-none">
              {currentTip.content.split('\n').map((paragraph, idx) => {
                if (paragraph.startsWith('**') && paragraph.endsWith('**')) {
                  return <h3 key={idx} className="text-xl font-semibold text-amber-800 mt-4 mb-2">{paragraph.replace(/\*\*/g, '')}</h3>;
                } else if (paragraph.startsWith('•')) {
                  return <li key={idx} className="ml-6 mb-1">{paragraph.substring(1).trim()}</li>;
                } else if (paragraph.trim()) {
                  return <p key={idx} className="mb-2">{paragraph}</p>;
                }
                return null;
              })}
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-amber-50">
          {/* Amazon Promotion Banner - Sempre visível no topo */}
          <div className="bg-gradient-to-r from-amber-600 to-amber-700 text-white text-center py-3 px-4 shadow-md no-print">
            <a 
              href="https://www.amazon.com/dp/B0FTTJYRT8" 
              target="_blank" 
              rel="noopener noreferrer" 
              className="hover:underline font-semibold inline-flex items-center gap-2 text-sm md:text-base"
            >
              📚 Love these recipes? Get the complete <strong>Beyond Kibble: Abby's Story</strong> book on Amazon →
            </a>
          </div>

          {/* Navigation */}
          <div className="bg-white shadow-md p-4 no-print sticky top-0 z-40">
            <div className="max-w-4xl mx-auto flex justify-between items-center">
              <button
                onClick={() => setCurrentView('toc')}
                className="text-amber-700 hover:text-amber-900 font-semibold"
              >
                ← Table of Contents
              </button>
              <button
                onClick={() => window.print()}
                className="bg-amber-600 text-white px-4 py-2 rounded hover:bg-amber-700"
              >
                🖨️ Print
              </button>
            </div>
          </div>

          {/* Content */}
          <div className="py-8">
            {currentView === 'toc' && renderTOC()}
            {currentView === 'recipe' && renderRecipe()}
            {currentView === 'tip' && renderTip()}
          </div>

          {/* Floating Amazon Button - Sempre visível no canto */}
          <a 
            href="https://www.amazon.com/dp/B0FTTJYRT8" 
            target="_blank" 
            rel="noopener noreferrer"
            className="no-print fixed bottom-6 right-6 bg-amber-600 text-white px-6 py-3 rounded-full shadow-2xl hover:bg-amber-700 hover:scale-105 transition-all duration-200 font-bold z-50 flex items-center gap-2"
          >
            📖 Buy the Book
          </a>

          {/* Footer */}
          <footer className="bg-white border-t border-amber-200 py-6 mt-12">
            <div className="max-w-4xl mx-auto px-4 text-center text-gray-600 text-sm">
              <p className="mb-2">Beyond Kibble Recipe & Tips Companion</p>
              <p>Always consult your veterinarian before making significant changes to your dog's diet.</p>
            </div>
          </footer>
        </div>
      );
    };

    ReactDOM.render(<RecipeBook />, document.getElementById('root'));
  </script>
</body>
</html>
