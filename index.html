<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Beyond Kibble Recipe & Tips - 18 recepten voor gezonde Labrador voeding">
    <title>Beyond Kibble Recepten App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .loading { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .spinner { border: 4px solid #f3f4f6; border-top: 4px solid #D97706; border-radius: 50%; 
                   width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"><div class="loading"><div class="spinner"></div></div></div>

    <script type="text/babel">
        const { useState } = React;

        const ChefHat = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
            </svg>
        );

        function RecipeApp() {
            const [currentPage, setCurrentPage] = useState(0);

            const recipes = [
                {
                    title: "Abby's Daily Base Recipe",
                    category: "Dagelijkse Maaltijden",
                    prepTime: "45 min",
                    ingredients: ["2kg kippendijen", "500g runderlever", "1kg groenten", "12 eieren"],
                    instructions: ["Kook kippendijen 20 min", "Snijd groenten grof", "Meng alles"],
                    tips: ["Roteer eiwitten wekelijks", "Groenten moeten 10-15% zijn"]
                }
            ];

            const renderCover = () => (
                <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-gradient-to-br from-amber-50 to-orange-50">
                    <div className="w-24 h-24 text-amber-600 mb-6"><ChefHat /></div>
                    <h1 className="text-5xl font-bold text-gray-800 text-center mb-4">Beyond Kibble</h1>
                    <h2 className="text-3xl text-amber-700 text-center mb-8">Recepten & Tips Gids</h2>
                    <div className="text-center text-gray-600">
                        <p className="text-xl">18 Complete Recepten</p>
                        <p className="text-lg">Jouw Praktische Gids</p>
                    </div>
                </div>
            );

            const renderRecipe = (recipe) => (
                <div className="min-h-screen p-8 bg-white">
                    <h2 className="text-3xl font-bold mb-4">{recipe.title}</h2>
                    <p className="text-amber-600 mb-4">{recipe.category} • {recipe.prepTime}</p>
                    
                    <div className="mb-6">
                        <h3 className="text-xl font-bold mb-3">Ingrediënten</h3>
                        <ul className="space-y-2">
                            {recipe.ingredients.map((ing, i) => (
                                <li key={i} className="flex gap-2">
                                    <span className="text-amber-600">•</span>
                                    <span>{ing}</span>
                                </li>
                            ))}
                        </ul>
                    </div>

                    <div className="mb-6">
                        <h3 className="text-xl font-bold mb-3">Instructies</h3>
                        <ol className="space-y-2">
                            {recipe.instructions.map((inst, i) => (
                                <li key={i} className="flex gap-3">
                                    <span className="font-bold text-amber-600">{i+1}.</span>
                                    <span>{inst}</span>
                                </li>
                            ))}
                        </ol>
                    </div>

                    <div className="bg-blue-50 p-4 rounded-lg">
                        <h3 className="font-bold mb-2">Tips:</h3>
                        {recipe.tips.map((tip, i) => (
                            <p key={i} className="text-sm mb-1">✓ {tip}</p>
                        ))}
                    </div>
                </div>
            );

            const pages = [
                { type: 'cover' },
                ...recipes.map(r => ({ type: 'recipe', content: r }))
            ];

            return (
                <div className="min-h-screen bg-gray-100">
                    <div className="max-w-4xl mx-auto bg-white shadow-lg">
                        {pages[currentPage].type === 'cover' && renderCover()}
                        {pages[currentPage].type === 'recipe' && renderRecipe(pages[currentPage].content)}
                        
                        <div className="p-4 flex justify-between bg-white border-t">
                            <button
                                onClick={() => setCurrentPage(Math.max(0, currentPage - 1))}
                                disabled={currentPage === 0}
                                className={`px-4 py-2 rounded ${currentPage === 0 ? 'bg-gray-200' : 'bg-amber-600 text-white'}`}
                            >
                                ← Vorige
                            </button>
                            <span className="py-2">Pagina {currentPage + 1} van {pages.length}</span>
                            <button
                                onClick={() => setCurrentPage(Math.min(pages.length - 1, currentPage + 1))}
                                disabled={currentPage === pages.length - 1}
                                className={`px-4 py-2 rounded ${currentPage === pages.length - 1 ? 'bg-gray-200' : 'bg-amber-600 text-white'}`}
                            >
                                Volgende →
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<RecipeApp />, document.getElementById('root'));
    </script>
</body>
</html>
